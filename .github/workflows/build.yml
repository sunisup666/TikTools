name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '8.14.3'
      - name: Android SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Map coordinate checks
        run: |
          mkdir -p build/map-math
          javac -d build/map-math app/src/main/java/io/github/sunisup666/tiktools/WebMercator.java tools/MapMathCheck.java
          java -cp build/map-math MapMathCheck
      - name: Compile app and diagnostic app
        run: gradle --no-daemon :app:assembleDebug :probe:assembleDebug --console=plain
